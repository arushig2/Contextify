<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contextify</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🧠 Contextify</h1>
            <p>Your AI Knowledge Assistant</p>
        </header>

        <div class="card">

            <h3>Current Page</h3>

            <p id="page-url">Loading...</p>
            
            <div class="source-badge" id="source-type">
                Detecting...
            </div>

            <button id="ingest-btn">
                Add to Knowledge Base
            </button>

            <p id="status"></p>

        </div>

        <div class="card">

            <h3>Ask a Question</h3>

            <textarea
                id="question"
                rows="3"
                placeholder="Ask something..."
            ></textarea>

            <button id="query-btn">
                Ask
            </button>

            <p id="query-status"></p>

        </div>

        <div class="card">

            <div class="answer-header">

                <h3>Answer</h3>

                <button id="copy-btn">
                    📋 Copy
                </button>

            </div>

            <div id="answer">
                No answer yet.
            </div>

            <hr class="answer-divider">

            <div id="citations">
            </div>

        </div>

    </div>

    <script type="module" src="popup.js"></script>

</body>

</html>
